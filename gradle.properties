#===============================================================================
# gradle.properties - SafeBase
#===============================================================================
#
# Tell Gradle where to find the locally installed JDK 26. Without this,
# the toolchain resolver would fall back to Foojay and download a fresh
# copy. The path matches the user's install at /usr/local/bin/jdk-26.
#
#===============================================================================

org.gradle.java.installations.paths=/usr/local/bin/jdk-26

# Standard build hygiene.
org.gradle.parallel=true
org.gradle.caching=true
